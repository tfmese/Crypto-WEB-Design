<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Yönetici Girişi | FolioVista - Kripto Danışmanlık</title>
    <link rel="icon" href="img/core-img/favicon.ico">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-image: url('img/bg-img/bg-1.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            max-width: 150px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="img/core-img/foliologo.png" alt="Logo" class="login-logo">

        <h4 class="mb-4 text-dark">Yönetici Girişi</h4>

        <form id="loginForm">
            <div class="form-group">
                <input type="text" class="form-control" id="kullaniciAdi" placeholder="Kullanıcı Adı" required>
            </div>

            <div class="form-group">
                <input type="password" class="form-control" id="sifre" placeholder="Şifre" required>
            </div>

            <button type="submit" class="btn cryptos-btn w-100">Giriş Yap</button>

            <div class="mt-3">
                <a href="index.html" class="text-muted" style="font-size: 14px;">← Ana Sayfaya Dön</a>
            </div>
        </form>
    </div>

    <script src="js/jquery/jquery-2.2.4.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#loginForm').on('submit', function (e) {
                e.preventDefault(); 

                var kAdi = $('#kullaniciAdi').val();
                var pass = $('#sifre').val();

                
                if (kAdi === 'admin' && pass === '1234') {
                   
                    window.location.href = 'admin.html';
                } else {
                  
                    alert('Hatalı Kullanıcı Adı veya Şifre!');
                }
            });
        });
    </script>

</body>
</html>
